name: Daily data update

# Runs after the US gold session closes and KRX data for the previous day is final.
# 21:40 UTC = 06:40 KST (Tue–Sat KST covers Mon–Fri US sessions).
on:
  schedule:
    - cron: "40 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Update data, models and pages
        run: bash scripts/update.sh
      - name: Commit refreshed data
        run: |
          git config user.name "gold-miner-bot"
          git config user.email "gold-miner-bot@users.noreply.github.com"
          git add data site/data site/dist
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: daily update $(date -u +%F)"
          git push
